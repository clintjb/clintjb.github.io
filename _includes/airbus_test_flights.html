        }

        ctx.beginPath();
        let started = false;
        const trailWindow = Math.max(480, speed * 60 * 3); // keep ~3s of real-time trail visible at any speed
        for (const [t, plat, plon] of path) {
          if (t > simTime) break;
          if (t < simTime - trailWindow) continue;
          const [x, y] = project(plat, plon);
          if (!started) { ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
        }
        if (started) {
          const [cx, cy] = project(lat, lon);
          ctx.lineTo(cx, cy);
          ctx.strokeStyle = colorForTrip(trip);
          ctx.globalAlpha = 0.6;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        if (simTime >= t0 && simTime <= t1) {
          const [x, y] = project(lat, lon);
          ctx.beginPath();
          ctx.fillStyle = colorForTrip(trip);
          ctx.arc(x, y, 3.2, 0, Math.PI * 2);
          ctx.fill();

          // Keep the identity intentionally compact: callsign · aircraft · purpose.
          // A subtle backing improves readability without turning the map into a dashboard.
          const label = [trip.callsign || 'Unknown', trip.model || 'Aircraft', trip.purpose || 'Airbus operation'].join(' · ');
          ctx.font = '11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.textBaseline = 'middle';
          const padX = 5, labelX = x + 7, labelY = y - 8;
          const width = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(15, 18, 24, 0.78)';
          ctx.fillRect(labelX - padX, labelY - 8, width + padX * 2, 16);
          ctx.fillStyle = '#e8ebf0';
          ctx.fillText(label, labelX, labelY);
        }
      }
    }
    clockEl.textContent = fmtClock(simTime);
    scrubber.value = Math.floor(simTime);
  }

  function tick(ts) {
    if (playing) {
      if (lastFrame != null) {
        const dt = (ts - lastFrame) / 1000;
        simTime += dt * speed * 60;
        if (simTime > rangeSeconds) simTime -= rangeSeconds;
      }
      lastFrame = ts;
      drawFrame();
    } else {
      lastFrame = null;
    }
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.innerHTML = playing ? '&#9654;' : '&#10074;&#10074;';
  });
  root.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  });
  scrubber.addEventListener('input', () => {
    simTime = Number(scrubber.value);
    drawFrame();
  });
  speedSel.addEventListener('change', () => { speed = Number(speedSel.value); });

  let earliest = 6 * 3600;
  for (const t of trips) if (t.path.length && t.path[0][0] < earliest) earliest = t.path[0][0];
  simTime = Math.max(0, earliest - 900);

  requestAnimationFrame(tick);
})();
</script>
</div>
