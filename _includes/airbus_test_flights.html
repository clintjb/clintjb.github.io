  const root = document.getElementById(ROOT_ID);
  if (!root) return;
  function $(name) { return root.querySelector('[data-atf="' + name + '"]'); }

  const geo = DATA.geo;
  const flightsMeta = DATA.flights.meta;
  const trips = DATA.flights.trips;

  function getCss(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }
  const siteColor = { TLS: getCss('--atf-tls'), XFW: getCss('--atf-xfw') };
  const palette = {
    panelBg: getCss('--atf-panel-bg'),
    land: getCss('--atf-land'),
    landLine: getCss('--atf-land-line'),
  };

  const bySite = { TLS: [], XFW: [] };
  for (const t of trips) bySite[t.site].push(t);

  $('count-TLS').innerHTML = '<b>' + bySite.TLS.length + '</b> flights';
  $('count-XFW').innerHTML = '<b>' + bySite.XFW.length + '</b> flights';

  const numDays = Math.max(1, flightsMeta.days || 1);
  const rangeSeconds = numDays * 86400;

  const dateLabel = flightsMeta.date || '';
  const rangeLabel = numDays > 1
    ? '<b>' + numDays + ' days from ' + dateLabel + '</b>'
    : '<b>' + dateLabel + '</b>, UTC';
  const synthNote = flightsMeta.synthetic
    ? ' &mdash; placeholder/synthetic data for testing, not real flights.'
    : '';
  const emptyNote = (!trips.length && !flightsMeta.synthetic)
    ? ' <i>No matching flights were recorded in this period.</i>'
    : '';
  $('headerSub').innerHTML =
    rangeLabel + '. Test, production-acceptance and customer-acceptance flights ' +
    'identified by <b>F-W</b> provisional registrations and <b>AIB</b> callsigns, plus ' +
    'the <b>Beluga</b> cargo shuttle fleet (<b>F-GST</b>/<b>F-GXL</b> registrations, ' +
    '<b>BGA</b> callsigns).' + synthNote + emptyNote;
  $('footerNote').textContent =
    'Space bar toggles playback when this widget is focused. Drag the scrubber to jump to a time. ' +
    'Times are UTC across both sites.';

  function makePanel(site) {
    const canvas = $('canvas-' + site);
    const ctx = canvas.getContext('2d');
    const g = geo[site];
    const color = siteColor[site];

    let W = 0, H = 0, dpr = 1;
    let project = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      W = Math.max(1, Math.floor(rect.width));
      H = Math.max(1, Math.floor(rect.height));
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      buildProjection();
      drawStatic();
    }

    function buildProjection() {
      const [aLat, aLon] = g.center;
      const zoom = 3.45;
      const minLon = aLon - zoom, maxLon = aLon + zoom;
      const minLat = aLat - zoom * 0.72, maxLat = aLat + zoom * 0.72;
      const padPx = 24;
      const sx = (W - padPx * 2) / (maxLon - minLon);
      const sy = (H - padPx * 2) / (maxLat - minLat);
      const s = Math.min(sx, sy);
      const offX = (W - (maxLon - minLon) * s) / 2;
      const offY = (H - (maxLat - minLat) * s) / 2;
      project = (lat, lon) => {
        const x = offX + (lon - minLon) * s;
        const y = H - (offY + (lat - minLat) * s);
        return [x, y];
      };
    }

    function drawStatic() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = palette.panelBg;
      ctx.fillRect(0, 0, W, H);

      // Pass 1: fill every ring first, so adjoining countries (sharing a
      // land border, not a coastline) still read as solid, gap-free land.
      ctx.fillStyle = palette.land;
      for (const ring of g.rings) {
        ctx.beginPath();
        ring.points.forEach(([lon, lat], i) => {
          const [x, y] = project(lat, lon);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
      }
      // Pass 2: stroke every ring's own outline on top, so a land border
      // between two adjoining countries (e.g. France/Spain) is visible as
      // a line even though there's no water gap between them there --
      // without this pass, only coastlines would show and neighbouring
      // countries would look like one undifferentiated landmass.
      ctx.strokeStyle = palette.landLine;
      ctx.lineWidth = 1;
      for (const ring of g.rings) {
        ctx.beginPath();
        ring.points.forEach(([lon, lat], i) => {
          const [x, y] = project(lat, lon);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.stroke();
      }

      const [ax, ay] = project(g.center[0], g.center[1]);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ax, ay, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    window.addEventListener('resize', resize);
    resize();

    return {
      project: () => project,
      redrawStatic: drawStatic,
      ctx,
    };
  }

  const panels = { TLS: makePanel('TLS'), XFW: makePanel('XFW') };

  let simTime = 0;
  let playing = true;
  let speed = 4;
  let lastFrame = null;

  const scrubber = $('scrubber');
  const clockEl = $('clock');
  const playBtn = $('playBtn');
  const speedSel = $('speed');

  scrubber.max = String(rangeSeconds);

  // Speed presets scale with the length of the range: a single day plays
  // through in a few minutes at a gentle pace, but a week of data at the
  // same pace would take over 40 minutes -- so multi-day ranges default to
  // much faster playback. "speed" means "1 real second = `speed` simulated
  // minutes."
  const speedPresets = numDays > 1
    ? [
        { value: 15, label: '15x' },
        { value: 30, label: '30x' },
        { value: 60, label: '60x', selected: true },
        { value: 120, label: '120x' },
        { value: 240, label: '240x' },
      ]
    : [
        { value: 1, label: '1x' },
        { value: 2, label: '2x' },
        { value: 4, label: '4x', selected: true },
        { value: 8, label: '8x' },
        { value: 16, label: '16x' },
      ];
  speedSel.innerHTML = speedPresets.map(p =>
    '<option value="' + p.value + '"' + (p.selected ? ' selected' : '') + '>' + p.label + '</option>'
  ).join('');
  speed = speedPresets.find(p => p.selected).value;

  function fmtClock(t) {
    t = ((t % rangeSeconds) + rangeSeconds) % rangeSeconds;
    const dayIndex = Math.floor(t / 86400);
    const secOfDay = t - dayIndex * 86400;
    const h = Math.floor(secOfDay / 3600).toString().padStart(2, '0');
    const m = Math.floor((secOfDay % 3600) / 60).toString().padStart(2, '0');
    return numDays > 1 ? ('Day ' + (dayIndex + 1) + ', ' + h + ':' + m) : (h + ':' + m);
  }

  function drawFrame() {
    for (const site of ['TLS', 'XFW']) {
      const panel = panels[site];
      panel.redrawStatic();
      const project = panel.project();
      const ctx = panel.ctx;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      for (const trip of bySite[site]) {
        const path = trip.path;
        if (!path.length) continue;
        const t0 = path[0][0], t1 = path[path.length - 1][0];
        if (simTime < t0 - 60 || simTime > t1 + 60) continue;

        let idx = 0;
        while (idx < path.length - 1 && path[idx + 1][0] < simTime) idx++;
        const a = path[idx];
        const b = path[Math.min(idx + 1, path.length - 1)];
        let lat, lon;
        if (b[0] === a[0]) { lat = a[1]; lon = a[2]; }
        else {
          const frac = Math.max(0, Math.min(1, (simTime - a[0]) / (b[0] - a[0])));
          lat = a[1] + (b[1] - a[1]) * frac;
          lon = a[2] + (b[2] - a[2]) * frac;
        }

        ctx.beginPath();
        let started = false;
        const trailWindow = Math.max(480, speed * 60 * 3); // keep ~3s of real-time trail visible at any speed
        for (const [t, plat, plon] of path) {
          if (t > simTime) break;
          if (t < simTime - trailWindow) continue;
          const [x, y] = project(plat, plon);
          if (!started) { ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
        }
        if (started) {
          const [cx, cy] = project(lat, lon);
          ctx.lineTo(cx, cy);
          ctx.strokeStyle = siteColor[site];
          ctx.globalAlpha = 0.6;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        if (simTime >= t0 && simTime <= t1) {
          const [x, y] = project(lat, lon);
          ctx.beginPath();
          ctx.fillStyle = siteColor[site];
          ctx.arc(x, y, 3.2, 0, Math.PI * 2);
          ctx.fill();

          // Keep the identity intentionally compact: callsign · aircraft · purpose.
          // A subtle backing improves readability without turning the map into a dashboard.
          const label = [trip.callsign || 'Unknown', trip.model || 'Aircraft', trip.purpose || 'Airbus operation'].join(' · ');
          ctx.font = '11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.textBaseline = 'middle';
          const padX = 5, labelX = x + 7, labelY = y - 8;
          const width = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(15, 18, 24, 0.78)';
          ctx.fillRect(labelX - padX, labelY - 8, width + padX * 2, 16);
          ctx.fillStyle = '#e8ebf0';
          ctx.fillText(label, labelX, labelY);
        }
      }
    }
    clockEl.textContent = fmtClock(simTime);
    scrubber.value = Math.floor(simTime);
  }

  function tick(ts) {
    if (playing) {
      if (lastFrame != null) {
        const dt = (ts - lastFrame) / 1000;
        simTime += dt * speed * 60;
        if (simTime > rangeSeconds) simTime -= rangeSeconds;
      }
      lastFrame = ts;
      drawFrame();
    } else {
      lastFrame = null;
    }
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.innerHTML = playing ? '&#9654;' : '&#10074;&#10074;';
  });
  root.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  });
  scrubber.addEventListener('input', () => {
    simTime = Number(scrubber.value);
    drawFrame();
  });
  speedSel.addEventListener('change', () => { speed = Number(speedSel.value); });

  let earliest = 6 * 3600;
  for (const t of trips) if (t.path.length && t.path[0][0] < earliest) earliest = t.path[0][0];
  simTime = Math.max(0, earliest - 900);

  requestAnimationFrame(tick);
})();
