  function makePanel(site) {
    const canvas = $('canvas-' + site);
    const ctx = canvas.getContext('2d');
    const g = geo[site];

    let W = 0, H = 0, dpr = 1;

      const rect = canvas.parentElement.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 3);

      const [aLat, aLon] = g.center;

      const minLon = aLon - zoom, maxLon = aLon + zoom;

      const sy = (H - padPx * 2) / (maxLat - minLat);
      const s = Math.min(sx, sy);
      const offX = (W - (maxLon - minLon) * s) / 2;
      const offY = (H - (maxLat - minLat) * s) / 2;
      project = (lat, lon) => {
        const x = offX + (lon - minLon) * s;
        const y = H - (offY + (lat - minLat) * s);

        simTime += dt * speed * 60;
        if (simTime > rangeSeconds) simTime -= rangeSeconds;
      }
      lastFrame = ts;
      drawFrame();
    } else {
      lastFrame = null;
    }
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.innerHTML = playing ? '&#9654;' : '&#10074;&#10074;';
  });
  root.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  });
  scrubber.addEventListener('input', () => {
    simTime = Number(scrubber.value);
    drawFrame();
  });
  speedSel.addEventListener('change', () => { speed = Number(speedSel.value); });

  let earliest = 6 * 3600;
  for (const t of trips) if (t.path.length && t.path[0][0] < earliest) earliest = t.path[0][0];
  simTime = Math.max(0, earliest - 900);

  requestAnimationFrame(tick);
})();
</script>
</div>
