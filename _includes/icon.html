{% comment %}
  Inline SVG icon include — replaces Ionicons.
  Usage: {% include icon.html name="arrow-down" class="arrow-down" %}
  "class" is optional and is appended to the wrapping <svg> element.
{% endcomment %}
{% case include.name %}

{% when "arrow-down" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg{% if include.class %} {{ include.class }}{% endif %}" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>

{% when "arrow-round-up" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg{% if include.class %} {{ include.class }}{% endif %}" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>

{% when "arrow-forward" %}
